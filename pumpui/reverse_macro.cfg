
#####################################################################
# PUMP_REVERSE: run the pump backwards ML millilitres (prime / clear line).
# Append to printer.cfg next to DISPENSE. NOT a dose.
# Keep steps_per_ml and speed equal to DISPENSE (dispense_macro.cfg), and
# max_ml equal to max_reverse_ml in config.json (default 5).
#####################################################################
[gcode_macro PUMP_REVERSE]
description: Reverse ML millilitres at the locked speed (capped)
gcode:
    {% set steps_per_ml = 637.0 %}
    {% set speed = 200 %}
    {% set max_ml = 5.0 %}
    {% set ml = params.ML|default(0)|float %}
    {% if not (ml > 0 and ml <= max_ml) %}
        {action_raise_error("PUMP_REVERSE: ML must be >0 and <= " ~ max_ml)}
    {% endif %}
    {% set steps = ml * steps_per_ml %}
    MANUAL_STEPPER STEPPER=pump ENABLE=1
    MANUAL_STEPPER STEPPER=pump SET_POSITION=0
    MANUAL_STEPPER STEPPER=pump MOVE={0 - steps} SPEED={speed}
