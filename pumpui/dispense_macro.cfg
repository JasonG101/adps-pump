
#####################################################################
# DISPENSE: mL-based dose used by the touch app.
# Speed, the mL->steps conversion and the max volume are locked here.
# The caller can only pass ML=. Keep max_ml equal to max_ml in config.json.
#####################################################################
[gcode_macro DISPENSE]
description: Dispense ML millilitres at the locked speed
gcode:
    # CALIBRATION CONSTANTS - update after Test A / Test B
    {% set steps_per_ml = 637.0 %}
    {% set offset_steps = 0.0 %}
    # LOCKED SETTINGS
    {% set speed = 200 %}
    {% set max_ml = 20.0 %}
    {% set ml = params.ML|default(0)|float %}
    {% if not (ml > 0 and ml <= max_ml) %}
        {action_raise_error("DISPENSE: ML must be >0 and <= " ~ max_ml)}
    {% endif %}
    {% set steps = ml * steps_per_ml + offset_steps %}
    {% if steps <= 0 %}
        {action_raise_error("DISPENSE: computed steps <= 0, check offset_steps")}
    {% endif %}
    MANUAL_STEPPER STEPPER=pump ENABLE=1
    MANUAL_STEPPER STEPPER=pump SET_POSITION=0
    MANUAL_STEPPER STEPPER=pump MOVE={steps} SPEED={speed}
