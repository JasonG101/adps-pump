
#####################################################################
# PUMP_PRIME: run the pump FORWARD ML millilitres to fill the tube with
# liquid before the syringe is attached. NOT a dose.
# Append to printer.cfg next to DISPENSE. Keep steps_per_ml and speed equal
# to DISPENSE, and max_ml equal to max_prime_ml in config.json (default 3).
# The UI sends prime_ml from config.json (default 1.5 mL). Lachlan to
# fine-tune the amount on the real tubing.
#####################################################################
[gcode_macro PUMP_PRIME]
description: Prime the line: ML millilitres forward at the locked speed (capped)
gcode:
    {% set steps_per_ml = 637.0 %}
    {% set speed = 200 %}
    {% set max_ml = 3.0 %}
    {% set ml = params.ML|default(0)|float %}
    {% if not (ml > 0 and ml <= max_ml) %}
        {action_raise_error("PUMP_PRIME: ML must be >0 and <= " ~ max_ml)}
    {% endif %}
    {% set steps = ml * steps_per_ml %}
    MANUAL_STEPPER STEPPER=pump ENABLE=1
    MANUAL_STEPPER STEPPER=pump SET_POSITION=0
    MANUAL_STEPPER STEPPER=pump MOVE={steps} SPEED={speed}
