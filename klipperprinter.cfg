[include mainsail.cfg]

[virtual_sdcard]
path: /home/group4-5/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50444672C852C71C-if00
restart_method: command

[printer]
kinematics: none
max_velocity: 500
max_accel: 1000

#####################################################################
# Kamoer Stepper on SKR Pico X-Axis Port
#####################################################################

[manual_stepper pump]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 200
velocity: 200
accel: 500

[tmc2209 manual_stepper pump]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.700
sense_resistor: 0.110
stealthchop_threshold: 999999

#####################################################################
# Control Macros (Step Input & Jogging)
#####################################################################

[gcode_macro PUMP_STEPS]
description: Move pump by a set number of full steps
gcode:
    {% set steps = params.STEPS|default(100)|float %}
    {% set speed = params.SPEED|default(200)|float %}
    MANUAL_STEPPER STEPPER=pump SET_POSITION=0
    MANUAL_STEPPER STEPPER=pump MOVE={steps} SPEED={speed}

[gcode_macro PUMP_OFF]
description: Turn off holding current on the pump stepper
gcode:
    MANUAL_STEPPER STEPPER=pump ENABLE=0
#####################################################################
# DISPENSE: mL-based dose used by the touch app.
# Speed, the mL->steps conversion and the max volume are locked here.
# The caller can only pass ML=. Keep max_ml equal to max_ml in config.json.
#####################################################################
[gcode_macro DISPENSE]
description: Dispense ML millilitres at the locked speed
gcode:
    # CALIBRATION CONSTANTS - update after Test A / Test B
    {% set steps_per_ml = 637.0 %}
    {% set offset_steps = 0.0 %}
    # LOCKED SETTINGS
    {% set speed = 200 %}
    {% set max_ml = 20.0 %}
    {% set ml = params.ML|default(0)|float %}
    {% if not (ml > 0 and ml <= max_ml) %}
        {action_raise_error("DISPENSE: ML must be >0 and <= " ~ max_ml)}
    {% endif %}
    {% set steps = ml * steps_per_ml + offset_steps %}
    {% if steps <= 0 %}
        {action_raise_error("DISPENSE: computed steps <= 0, check offset_steps")}
    {% endif %}
    MANUAL_STEPPER STEPPER=pump ENABLE=1
    MANUAL_STEPPER STEPPER=pump SET_POSITION=0
    MANUAL_STEPPER STEPPER=pump MOVE={steps} SPEED={speed}
